<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afbeelding volledig stylen</title>
  <link rel="stylesheet" href="afbeelding.css">
</head>
<body>
  <h1>Afbeelding volledig stylen</h1>

  <div class="naast-elkaar">
    <figure>
      <img class="foto grijs" src="images/landschap.jpg" alt="Bergen bij zonsondergang met een gele zon en groen gras">
      <figcaption>filter: grayscale(100%)</figcaption>
    </figure>
    <figure>
      <img class="foto helder" src="images/landschap.jpg" alt="Bergen bij zonsondergang met een gele zon en groen gras">
      <figcaption>filter: brightness(1.3)</figcaption>
    </figure>
  </div>
</body>
</html>
