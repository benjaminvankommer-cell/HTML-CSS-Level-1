<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Display vergelijking</title>
  <link rel="stylesheet" href="display.css">
</head>
<body>
  <h2>display: block</h2>
  <div class="blok rood">Block 1</div>
  <div class="blok groen">Block 2</div>
  <div class="blok blauw">Block 3</div>

  <h2>display: inline</h2>
  <div class="inline rood">Inline 1</div>
  <div class="inline groen">Inline 2</div>
  <div class="inline blauw">Inline 3</div>

  <h2>display: inline-block</h2>
  <div class="inline-blok rood">Inline-block 1</div>
  <div class="inline-blok groen">Inline-block 2</div>
  <div class="inline-blok blauw">Inline-block 3</div>
</body>
</html>
